# version: 2022-07-21

name: "Deploy Now: Deploy to IONOS"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      project-id:
        required: true
        type: string
      branch-id:
        required: true
        type: string
      deployment-ids:
        required: true
        type: string

  push:
    paths:
      - ./.github/workflows/deploy-to-ionos.yaml

concurrency: ${{ github.ref }}

jobs:
  deploy-to-ionos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read

    strategy:
      matrix:
        deployment-id: ${{ fromJson(inputs.deployment-ids) }}

    steps:
      - name: Update deployment status
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: in_progress

      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          version: ${{ inputs.version }}
          action: download

      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@v1
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: retrieve-info

      - name: Check IONOS template variables Here
        env:
          TEMPLATE_VARS: ${{ steps.deployment.outputs.template-variables }}
        run: |
          echo "=== IONOS template variables ==="

          echo "$TEMPLATE_VARS" | grep -o '"[^"]*IONOS_DB_[^"]*"' \
          | sed 's/:.*//' \
          | sort -u \
          || echo "No IONOS_DB_* variables found"

          echo ""
          echo "=== Deployment-specific DB secrets available ==="

          env | grep '^IONOS_DEPLOYMENT_.*_DB_' \
          | sed 's/=.*$/=<set>/' \
          | sort \
          || echo "No deployment DB variables exposed to this step"

      # ------------------------------------------------------------
      # Render .env.template -> .env
      # ------------------------------------------------------------

      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@v2
        id: template
        with:
          deployment-id: ${{ matrix.deployment-id }}
          data: "[${{ toJson(secrets) }}, ${{ steps.deployment.outputs.template-variables }}]"
          input-directory: deployment
          output-directory: deployment

      # ------------------------------------------------------------
      # Check generated .env
      # ------------------------------------------------------------

      - name: Check rendered environment
        run: |
          echo "=== .deploy-now/gta directory ==="
          ls -la deployment/.deploy-now/gta/

          echo ""
          echo "=== Rendered .env status ==="

          if [ ! -f deployment/.deploy-now/gta/.env ]; then
            echo "ERROR: .env was NOT generated."
            exit 1
          fi

          echo ".env WAS generated successfully."

          echo ""
          echo "=== Checking rendered values ==="

          echo ""
          echo "DB_CONNECTION:"
          grep '^DB_CONNECTION=' deployment/.deploy-now/gta/.env \
            | sed 's/=.*/=<set>/'

          echo "DB_HOST:"
          grep '^DB_HOST=' deployment/.deploy-now/gta/.env \
            | sed 's/=.*/=<set>/'

          echo "DB_PORT:"
          grep '^DB_PORT=' deployment/.deploy-now/gta/.env \
            | sed 's/=.*/=<set>/'

          echo "DB_DATABASE:"
          grep '^DB_DATABASE=' deployment/.deploy-now/gta/.env \
            | sed 's/=.*/=<set>/'

          echo "DB_USERNAME:"
          grep '^DB_USERNAME=' deployment/.deploy-now/gta/.env \
            | sed 's/=.*/=<set>/'

          if grep -q '^DB_PASSWORD=' deployment/.deploy-now/gta/.env; then
            echo "DB_PASSWORD: <set>"
          else
            echo "DB_PASSWORD: <missing>"
            exit 1
          fi

          echo ""
          echo "=== Checking for unresolved template variables ==="

          if grep -q 'IONOS_DB_' deployment/.deploy-now/gta/.env; then
            echo "WARNING: Unresolved IONOS_DB_ variable found."
            grep 'IONOS_DB_' deployment/.deploy-now/gta/.env \
              | sed 's/=.*/=<redacted>/'
            exit 1
          else
            echo "No unresolved IONOS_DB_ variables found."
          fi

      # ------------------------------------------------------------
      # Render real site URL
      # ------------------------------------------------------------

      - name: Render real site-url to all files
        run: |
          for file in `grep -rl 'https://IONOS_DEPLOY_NOW_SITE_URL' .`; do
            sed -i $file -e 's|https://IONOS_DEPLOY_NOW_SITE_URL|${{ fromJson(steps.deployment.outputs.info).site-url }}|g'
          done

      # ------------------------------------------------------------
      # Determine SSH username secret
      # ------------------------------------------------------------

      - name: Render SSH user secret name
        run: |
          echo SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_`echo ${{ matrix.deployment-id }} | tr '[:lower:]' '[:upper:]' | tr '-' '_'`_SSH_USERNAME >> $GITHUB_ENV

      - name: Inspect IONOS deployment configuration
        run: |
          echo "=== .deploy-now tree ==="
          find deployment/.deploy-now -maxdepth 3 -type f -print

          echo ""
          echo "=== Root deployment config ==="
          if [ -f deployment/.deploy-now/config.yaml ]; then
            echo "FOUND: deployment/.deploy-now/config.yaml"
            cat deployment/.deploy-now/config.yaml
          else
            echo "NOT FOUND: deployment/.deploy-now/config.yaml"
          fi

          echo ""
          echo "=== Project deployment config ==="
          if [ -f deployment/.deploy-now/gta/config.yaml ]; then
            echo "FOUND: deployment/.deploy-now/gta/config.yaml"
          else
            echo "NOT FOUND: deployment/.deploy-now/gta/config.yaml"
          fi

          echo ""
          echo "=== Rendered environment ==="
          if [ -f deployment/.deploy-now/gta/.env ]; then
            echo "FOUND: deployment/.deploy-now/gta/.env"
          else
            echo "NOT FOUND: deployment/.deploy-now/gta/.env"
          fi

      # ------------------------------------------------------------
      # Deploy to IONOS
      # ------------------------------------------------------------

      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          deployment-info: ${{ steps.deployment.outputs.info }}
          ssh-user: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}

      # ------------------------------------------------------------
      # Update deployment status
      # ------------------------------------------------------------

      - name: Update deployment status
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: ${{ job.status }}

  # --------------------------------------------------------------
  # Notify all deployments finished
  # --------------------------------------------------------------

  notify-deployment-finished:
    needs: deploy-to-ionos
    if: ${{ github.event_name == 'workflow_dispatch' && always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Notify all deployments finished
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          action: set-deployments-finished
