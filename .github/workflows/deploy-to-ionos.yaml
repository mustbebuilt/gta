# Please do not edit this file.
# More information under https://docs.ionos.space/docs/github-actions-customization/
# version: 2022-07-21

name: "Deploy Now: Deploy to IONOS"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      project-id:
        required: true
        type: string
      branch-id:
        required: true
        type: string
      deployment-ids:
        require: true
        type: string

  push:
    path:
      - ./.github/workflows/deploy-to-ionos.yaml

concurrency: ${{ github.ref }}

jobs:
  deploy-to-ionos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read

    strategy:
      matrix:
        deployment-id: ${{ fromJson(inputs.deployment-ids) }}

    steps:
      # ------------------------------------------------------------
      # Update deployment status
      # ------------------------------------------------------------
      - name: Update deployment status
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: in_progress

      # ------------------------------------------------------------
      # Retrieve stored deployment
      # ------------------------------------------------------------
      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          version: ${{ inputs.version }}
          action: download

      # ------------------------------------------------------------
      # Diagnostic: inspect deployment before rendering
      # ------------------------------------------------------------
      - name: Inspect deployment files
        run: |
          echo "=== Deployment root ==="
          ls -la deployment

          echo ""
          echo "=== Deploy Now directory ==="
          if [ -d deployment/.deploy-now ]; then
            find deployment/.deploy-now -maxdepth 3 -type f -print
          else
            echo "WARNING: deployment/.deploy-now does not exist"
          fi

          echo ""
          echo "=== Environment files before template rendering ==="
          find deployment -name ".env*" -type f -print

      # ------------------------------------------------------------
      # Fetch deployment information
      # ------------------------------------------------------------
      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@v1
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: retrieve-info

      # ------------------------------------------------------------
      # Render .env.template and other runtime templates
      #
      # IMPORTANT:
      # No intermediate-data-file is specified here.
      # ------------------------------------------------------------
      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@v2
        id: template
        with:
          deployment-id: ${{ matrix.deployment-id }}
          data: "[${{ toJson(secrets) }}, ${{ steps.deployment.outputs.template-variables }}]"
          input-directory: deployment
          output-directory: deployment

      # ------------------------------------------------------------
      # Diagnostic: inspect results of template rendering
      # ------------------------------------------------------------
      - name: Check rendered environment
  run: |
    echo "=== Environment files after rendering ==="
    find deployment -name ".env*" -type f -print

    echo ""
    echo "=== Rendered .env ==="

    if [ -f deployment/.deploy-now/gta/.env ]; then
      echo ".env WAS generated successfully."
      echo ""
      echo "Checking rendered variables..."

      grep -E '^DB_CONNECTION=' deployment/.deploy-now/gta/.env || echo "DB_CONNECTION missing"
      grep -E '^DB_HOST=' deployment/.deploy-now/gta/.env || echo "DB_HOST missing"
      grep -E '^DB_PORT=' deployment/.deploy-now/gta/.env || echo "DB_PORT missing"
      grep -E '^DB_DATABASE=' deployment/.deploy-now/gta/.env || echo "DB_DATABASE missing"
      grep -E '^DB_USERNAME=' deployment/.deploy-now/gta/.env || echo "DB_USERNAME missing"

      if grep -q '^DB_PASSWORD=' deployment/.deploy-now/gta/.env; then
        echo "DB_PASSWORD=<set>"
      else
        echo "DB_PASSWORD=<missing>"
      fi
    else
      echo ".env was NOT generated!"
      exit 1
    fi

      # ------------------------------------------------------------
      # Render real site URL into files
      # ------------------------------------------------------------
      - name: Render real site-url to all files
        run: |
          for file in `grep -rl 'https://IONOS_DEPLOY_NOW_SITE_URL' .`; do
            sed -i $file -e 's|https://IONOS_DEPLOY_NOW_SITE_URL|${{ fromJson(steps.deployment.outputs.info).site-url }}|g'
          done

      # ------------------------------------------------------------
      # Determine SSH username secret
      # ------------------------------------------------------------
      - name: Render SSH user secret name
        run: |
          echo SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_`echo ${{ matrix.deployment-id }} | tr '[:lower:]' '[:upper:]' | tr '-' '_'`_SSH_USERNAME >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Deploy to IONOS
      # ------------------------------------------------------------
      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          deployment-info: ${{ steps.deployment.outputs.info }}
          ssh-user: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}

      # ------------------------------------------------------------
      # Update deployment status
      # ------------------------------------------------------------
      - name: Update deployment status
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: ${{ job.status }}

  # ==================================================================
  # Notify deployments finished
  # ==================================================================

  notify-deployment-finished:
    needs: deploy-to-ionos
    if: ${{ github.event_name == 'workflow_dispatch' && always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Notify all deployments finished
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          action: set-deployments-finished
