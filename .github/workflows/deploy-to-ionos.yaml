# version: 2022-07-21

name: "Deploy Now: Deploy to IONOS"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      project-id:
        required: true
        type: string
      branch-id:
        required: true
        type: string
      deployment-ids:
        required: true
        type: string

  push:
    paths:
      - ./.github/workflows/deploy-to-ionos.yaml

concurrency: ${{ github.ref }}

jobs:
  deploy-to-ionos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read

    strategy:
      matrix:
        deployment-id: ${{ fromJson(inputs.deployment-ids) }}

    steps:
      # ------------------------------------------------------------
      # Mark deployment as in progress
      # ------------------------------------------------------------

      - name: Update deployment status
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: in_progress

      # ------------------------------------------------------------
      # Retrieve the build artifact
      # ------------------------------------------------------------

      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          version: ${{ inputs.version }}
          action: download

      # ------------------------------------------------------------
      # Get deployment information and IONOS variables
      # ------------------------------------------------------------

      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@v1
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: retrieve-info

      # ------------------------------------------------------------
      # Render .env.template -> .env
      #
      # IONOS supplies the deployment-specific variables through
      # steps.deployment.outputs.template-variables.
      # ------------------------------------------------------------

      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@v2
        id: template
        with:
          deployment-id: ${{ matrix.deployment-id }}
          data: "[${{ toJson(secrets) }}, ${{ steps.deployment.outputs.template-variables }}]"
          input-directory: deployment
          output-directory: deployment

      # ------------------------------------------------------------
      # Verify generated runtime configuration
      #
      # Do NOT display the contents of .env.
      # ------------------------------------------------------------

      - name: Check rendered environment
        run: |
          echo "=== Deployment configuration ==="

          if [ -f deployment/.deploy-now/gta/config.yaml ]; then
            echo "config.yaml: <present>"
          else
            echo "ERROR: deployment/.deploy-now/gta/config.yaml is missing"
            exit 1
          fi

          if [ -f deployment/.deploy-now/gta/.env.template ]; then
            echo ".env.template: <present>"
          else
            echo "ERROR: deployment/.deploy-now/gta/.env.template is missing"
            exit 1
          fi

          if [ -f deployment/.deploy-now/gta/.env ]; then
            echo ".env: <present>"
          else
            echo "ERROR: deployment/.deploy-now/gta/.env was not generated"
            exit 1
          fi

          echo ""
          echo "=== Rendered environment variables ==="

          check_var() {
            local name="$1"

            if grep -q "^${name}=" deployment/.deploy-now/gta/.env; then
              echo "${name}: <set>"
            else
              echo "${name}: <missing>"
              return 1
            fi
          }

          check_var DB_CONNECTION
          check_var DB_HOST
          check_var DB_PORT
          check_var DB_DATABASE
          check_var DB_USERNAME
          check_var DB_PASSWORD

          echo ""
          echo "=== Checking for unresolved IONOS variables ==="

          if grep -q 'IONOS_DB_' deployment/.deploy-now/gta/.env; then
            echo "ERROR: unresolved IONOS_DB_ variable found in .env"
            grep 'IONOS_DB_' deployment/.deploy-now/gta/.env \
              | sed 's/=.*/=<redacted>/'
            exit 1
          fi

          echo "No unresolved IONOS_DB_ variables found."

      # ------------------------------------------------------------
      # Render the real site URL
      # ------------------------------------------------------------

      - name: Render real site-url to all files
        run: |
          for file in $(grep -rl 'https://IONOS_DEPLOY_NOW_SITE_URL' . --exclude-dir=.git); do
            sed -i \
              's|https://IONOS_DEPLOY_NOW_SITE_URL|${{ fromJson(steps.deployment.outputs.info).site-url }}|g' \
              "$file"
          done

      # ------------------------------------------------------------
      # Determine SSH username secret
      # ------------------------------------------------------------

      - name: Render SSH user secret name
        run: |
          echo "SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_$(echo '${{ matrix.deployment-id }}' | tr '[:lower:]' '[:upper:]' | tr '-' '_')_SSH_USERNAME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Deploy to IONOS
      # ------------------------------------------------------------

      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          deployment-info: ${{ steps.deployment.outputs.info }}
          ssh-user: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}

      # ------------------------------------------------------------
      # Update deployment status
      # ------------------------------------------------------------

      - name: Update deployment status
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: ${{ job.status }}

  # --------------------------------------------------------------
  # Notify all deployments finished
  # --------------------------------------------------------------

  notify-deployment-finished:
    needs: deploy-to-ionos
    if: ${{ github.event_name == 'workflow_dispatch' && always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Notify all deployments finished
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          action: set-deployments-finished
